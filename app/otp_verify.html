<body>
    <!-- From Uiverse.io by NelsonDJCR --> 

     <div class="mainCard"> 
      <form class="form-card">
        <p class="form-card-title">We're calling your number to confirm it</p>
        <p class="form-card-prompt">Enter last 4 digits of the number we are calling you from</p>
        <div class="form-card-input-wrapper">
          <input class="form-card-input" maxlength="6" placeholder="______" type="text" inputmode="numeric" autocomplete="one-time-code" required>
          <div class="form-card-input-bg"></div>
        </div>
        <button class="form-card-button">Verify</button>
        <p class="call-again"><span class="underlined">call again</span> in 0:30 seconds</p>
    

      </form>
    
    </div>
    <script src="/app/API.js"></script>
    <script src="/js/security/security.js"></script>
    <script src="otp_verify.js"></script>
</body>
